# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    app.auth_token_ttl: '%env(int:AUTH_TOKEN_TTL)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # The loader needs the resolved DSN and environment to refuse non-local targets.
    App\DataFixtures\SyntheticFixtureLoader:
        arguments:
            $environment: '%kernel.environment%'
            $databaseUrl: '%env(resolve:DATABASE_URL)%'

    App\Controller\AuthApiController:
        arguments:
            $tokenTtl: '%app.auth_token_ttl%'

    # AI brainstorming generation (docs/architecture/AI_BRAINSTORMING_CONTRACT.md).
    # The single provider of this release is selected through the interface, so a
    # second provider is a new class plus configuration, not a controller change.
    App\Ai\Brainstorming\BrainstormingProviderInterface:
        alias: App\Ai\Brainstorming\Provider\OpenAiCompatibleBrainstormingProvider

    App\Ai\Brainstorming\Provider\OpenAiCompatibleBrainstormingProvider:
        arguments:
            $enabled: '%env(bool:AI_ENABLED)%'
            $providerSlug: '%env(string:AI_PROVIDER)%'
            $baseUrl: '%env(string:AI_BASE_URL)%'
            $model: '%env(string:AI_MODEL)%'
            $apiKey: '%env(string:AI_PROVIDER_API_KEY)%'
            $timeoutSeconds: '%env(int:AI_TIMEOUT_SECONDS)%'

    # Quota is enforced per user and per deployment; see contract §6.8.
    App\Ai\AiGenerationRateLimiter:
        arguments:
            $perTenMinutes: '%env(int:AI_RATE_LIMIT_PER_10_MINUTES)%'
            $perHour: '%env(int:AI_RATE_LIMIT_PER_HOUR)%'
            $globalPerMinute: '%env(int:AI_RATE_LIMIT_GLOBAL_PER_MINUTE)%'

    App\Security\AuthThrottle:
        arguments:
            $enabled: '%env(bool:AUTH_THROTTLE_ENABLED)%'
            $loginMaxAttempts: '%env(int:AUTH_LOGIN_MAX_ATTEMPTS)%'
            $loginIpMaxAttempts: '%env(int:AUTH_LOGIN_IP_MAX_ATTEMPTS)%'
            $loginWindowSeconds: '%env(int:AUTH_LOGIN_WINDOW_SECONDS)%'
            $registerMaxAttempts: '%env(int:AUTH_REGISTER_MAX_ATTEMPTS)%'
            $registerWindowSeconds: '%env(int:AUTH_REGISTER_WINDOW_SECONDS)%'
