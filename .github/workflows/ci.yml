name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run build
      - run: pnpm test

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          # Doctrine appends "_test" in the test environment, so the base name
          # matches backend/.env.test; the actual test database is mosaiq_test.
          POSTGRES_DB: mosaiq
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d mosaiq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: test
      APP_DEBUG: 0
      DATABASE_URL: "postgresql://app:app@127.0.0.1:5432/mosaiq?serverVersion=16&charset=utf8"
      MAILER_DSN: "null://null"
      APP_FRONTEND_URL: "http://localhost:5173"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          # composer.json pins config.platform.php to 8.3.0, so the lock must
          # always resolve for this declared minimum (also the PHPUnit 12 floor).
          php-version: "8.3"
          extensions: ctype, iconv, pdo, pdo_pgsql
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer validate --no-check-publish
      - run: composer audit --locked
      - run: composer check-platform-reqs
      - run: php bin/console lint:container
      - run: php bin/console doctrine:database:create --if-not-exists
      - run: php bin/console doctrine:migrations:migrate --no-interaction
      - run: php bin/console doctrine:schema:validate
      - run: composer analyse
      - run: composer cs:check
      - run: php bin/phpunit
